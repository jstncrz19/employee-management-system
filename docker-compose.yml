services:
  postgres:
    image: postgres:18
    container_name: employee-management-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: employee_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build:
      context: ./backend
    container_name: employee-management-backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/employee_management
      JWT_SECRET_KEY: change-this-to-a-random-secret
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data: